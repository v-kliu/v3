name: Docs Maintenance

on:
  schedule:
    # 3pm UTC daily = morning US Pacific
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # History for the last-change lookup
          fetch-depth: 100
          token: ${{ secrets.GH_PAT }}

      - name: Format README
        id: docs
        run: node scripts/docs-maintenance.mjs

      - name: Commit and push
        if: steps.docs.outputs.commit == 'true'
        run: |
          git config user.name "Victor Liu"
          git config user.email "64110392+v-kliu@users.noreply.github.com"
          git add README.md
          git commit -m "docs: tidy README formatting"
          git push

      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Docs maintenance failed (GH_PAT expired?): ${RUN_URL}"

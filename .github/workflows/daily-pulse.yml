name: Daily Pulse

on:
  schedule:
    # 3pm UTC daily = morning US Pacific
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Decide and toggle README
        id: pulse
        run: node scripts/daily-pulse.mjs

      - name: Commit and push
        if: steps.pulse.outputs.commit == 'true'
        run: |
          git config user.name "Victor Liu"
          git config user.email "64110392+v-kliu@users.noreply.github.com"
          git add README.md
          git commit -m "docs: tidy README formatting"
          git push

      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Daily pulse failed (GH_PAT expired?): ${RUN_URL}"

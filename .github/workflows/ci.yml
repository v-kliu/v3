name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Stub required env vars so the build does not fail on missing secrets.
          # Real values live in Vercel; CI only needs the build to compile.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          TELEGRAM_BOT_TOKEN: placeholder
          TELEGRAM_WEBHOOK_SECRET: placeholder
          JWT_SECRET: placeholder_32_chars_minimum_here_ok
          ADMIN_PASSWORD: placeholder
          ADMIN_IP: 0.0.0.0
          AVIATIONSTACK_API_KEY: placeholder
